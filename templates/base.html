<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>FaceMash{% block title %}{% endblock %}</title>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div id="shell">

  <div id="header">
    <h1>FaceMash</h1>
    <div id="header-nav">
      <a href="{{ url_for('vote') }}">Vote</a> &middot;
      <a href="{{ url_for('leaderboard') }}">Leaderboard</a> &middot;
      {% if session.get('admin') %}
        <a href="{{ url_for('upload') }}">Upload</a> &middot;
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Admin</a>
      {% endif %}
    </div>
  </div>

  <div id="subheader">
    Were we let in for our looks? No. Will we be judged on them? Yes.
  </div>

  <div id="content">
    {% block content %}{% endblock %}
  </div>

  <div id="footer">
    FaceMash &copy; 2003
  </div>

</div>

</body>
</html>
