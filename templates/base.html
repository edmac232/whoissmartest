<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whoissmartest{% block title %}{% endblock %}</title>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div id="shell">

  <div id="header">
    <h1>Whoissmartest</h1>
    <div id="header-nav">
      <a href="{{ url_for('vote') }}">Vote</a> &middot;
      <a href="{{ url_for('leaderboard') }}">Leaderboard</a> &middot;
      {% if session.get('admin') %}
        <a href="{{ url_for('upload') }}">Upload</a> &middot;
        <a href="{{ url_for('logout') }}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}">Admin</a>
      {% endif %}
    </div>
  </div>

  <div id="subheader">
    Were we let in for our minds? Yes. Will we be judged on them? Yes.
  </div>

  <div id="content">
    {% block content %}{% endblock %}
  </div>

  <div id="footer">
    Whoissmartest &copy; 2026 &middot; Deciphering Intellectual Giants
  </div>

</div>

<script>
// Web Audio API Synthesizer for Authentic Chalk/Board Sounds
window.playChalkSound = (type = 'click') => {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (type === 'click') {
      // 1. Chalk scratch/scribble (Bandpass filtered white noise)
      const bufferSize = audioCtx.sampleRate * 0.08;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
      filter.Q.setValueAtTime(2.5, audioCtx.currentTime);
      
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
      
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      
      // 2. High-pitched scholarly chime
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(950, audioCtx.currentTime);
      
      oscGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
      
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      
      noise.start();
      osc.start();
      noise.stop(audioCtx.currentTime + 0.08);
      osc.stop(audioCtx.currentTime + 0.23);
    } else if (type === 'tap') {
      // Chalk tap (Faint, low frequency tick)
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
      
      oscGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }
  } catch (e) {
    console.warn("Web Audio not supported or blocked:", e);
  }
};

// Add subtle tap sound to all menu navigation links
document.querySelectorAll('#header-nav a').forEach(a => {
  a.addEventListener('click', () => window.playChalkSound('tap'));
});
</script>

</body>
</html>
